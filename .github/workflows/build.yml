name: Build Docs

# Builds the site in strict mode, so a broken link or a nav entry
# pointing at a missing page fails the PR rather than the deploy.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked

      - name: Build site
        run: uv run zensical build --strict
