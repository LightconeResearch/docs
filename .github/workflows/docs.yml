name: Docs

# Builds the site in strict mode on every PR, so a broken link or a nav
# entry pointing at a missing page fails the PR rather than the deploy.
# On main, the same build is then published to GitHub Pages (Settings →
# Pages → Source must be "GitHub Actions").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked

      - name: Build site
        run: uv run zensical build --clean --strict

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys queue rather than cancel each other, so one is never
    # interrupted mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
