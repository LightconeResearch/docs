[project]
site_name = "Lightcone Research Stack"
site_description = "Install Lightcone, work with a research agent, and build reproducible analyses with ASTRA."
site_url = "https://docs.lightconeresearch.org/"
site_author = "Lightcone Research"
repo_url = "https://github.com/LightconeResearch/docs"
repo_name = "LightconeResearch/docs"
copyright = "&copy; 2026 Lightcone Research"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]

nav = [
  {"Home" = "index.md"},
  {"Start here" = [
    {"Meet the stack" = "user/index.md"},
    {"Install" = "user/install.md"},
    {"Your first analysis" = "user/getting-started.md"},
  ]},
  {"Guides" = [
    {"Work with an agent" = "user/agents.md"},
    {"Core concepts" = "user/concepts.md"},
    {"Run on a cluster" = "user/cluster.md"},
    {"Write a report" = "user/reporting.md"},
    {"Share your work" = "user/sharing.md"},
    {"Troubleshooting" = "user/troubleshooting.md"},
  ]},
  {"Reference" = [
    {"CLI commands" = [
      {"Overview" = "cli/index.md"},
      {"lc init" = "cli/init.md"},
      {"lc compute" = "cli/compute.md"},
      {"lc materialize" = "cli/materialize.md"},
      {"lc status" = "cli/status.md"},
      {"lc run" = "cli/run.md"},
      {"lc build" = "cli/build.md"},
    ]},
    {"ASTRA · external standard" = "user/astra.md"},
    {"Glossary" = "user/glossary.md"},
  ]},
  {"Contribute" = [
    {"Overview" = "maintainer.md"},
    {"Development setup" = "contributing/setup.md"},
    {"Testing" = "contributing/testing.md"},
    {"Extending the CLI" = "contributing/extending.md"},
    {"CLI architecture" = "architecture.md"},
    {"Engine internals" = [
      {"Overview" = "api/index.md"},
      {"project" = "api/project.md"},
      {"dataset" = "api/dataset.md"},
      {"identity" = "api/identity.md"},
      {"plan" = "api/plan.md"},
      {"assets" = "api/assets.md"},
      {"worker" = "api/worker.md"},
      {"materialize" = "api/materialize.md"},
      {"compute" = "api/compute.md"},
      {"venue (legacy)" = "api/venue.md"},
      {"sandbox" = "api/sandbox.md"},
      {"image & container" = "api/container.md"},
      {"crate" = "api/crate.md"},
    ]},
  ]},
  {"ASTRA docs ↗" = "https://astra-spec.org/latest/"},
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "lucide/globe"
link = "https://lightconeresearch.org/"
name = "Lightcone Research website"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LightconeResearch"
name = "Lightcone Research on GitHub"
